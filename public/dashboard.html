    <!-- Font Awesome -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js & Flatpickr -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 
      NEW, CONSOLIDATED STYLES 
      This <style> block replaces your external style.css and the inline <style> block.
      It's designed to work with YOUR HTML structure and make it mobile-friendly.
    -->
    <style>
        /* Base styles */
        body {
            font-family: 'Rubik', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f1f5f9; /* Light gray background */
            color: #1e293b;
            /* Prevent body from scrolling when a panel is open */
            overflow-x: hidden;
        }

        .dark body {
            background-color: #0f172a; /* Dark background */
            color: #e2e8f0;
        }

        /* Utility for back buttons */
        .panel-back-btn {
            display: flex; /* Hidden by default on desktop */
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            color: #2563eb;
            padding: 0.5rem 0.75rem;
            border-radius: 9999px;
            background-color: transparent;
            margin-bottom: 1rem;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .panel-back-btn:hover, .panel-back-btn:focus-visible {
            background-color: #eff6ff;
            border-color: #dbeafe;
            outline: none;
        }
        .dark .panel-back-btn {
            color: #60a5fa;
        }
        .dark .panel-back-btn:hover, .dark .panel-back-btn:focus-visible {
            background-color: #1e293b;
            border-color: #334155;
        }

        /* Main Dashboard Shell - Respects your original class */
        .dashboard-shell {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
        }

        /* Dashboard Tabs - Make them scrollable on mobile */
        .dashboard-tabs {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow-x: auto; /* Allows horizontal scrolling of tabs */
            padding: 0.5rem;
            border-radius: 9999px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        .dashboard-tabs::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }
        .dark .dashboard-tabs {
            background-color: #1e293b;
        }

        .dashboard-tab {
            border: 1px solid transparent;
            background: transparent;
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .dashboard-tab.is-active {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2), 0 2px 4px -2px rgba(59, 130, 246, 0.2);
        }
        .dark .dashboard-tab {
            color: #94a3b8;
        }
        .dark .dashboard-tab.is-active {
            background: #3b82f6;
            color: #ffffff;
        }

        /* Dashboard Panels */
        .dashboard-panels {
            position: relative;
            margin-top: 1.5rem;
        }

        .dashboard-panel {
            display: none; /* Hidden by default */
            animation: panelFade 0.3s ease;
        }
        .dashboard-panel.is-active {
            display: block; /* Shown when active */
        }

        @keyframes panelFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Panel Card - Your original card style, made responsive */
        .panel-card {
            background-color: #ffffff;
            border-radius: 1.5rem; /* 24px */
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 100%; /* Prevents overflow */
        }
        .dark .panel-card {
            background-color: #1e293b;
        }
        
        .panel-stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        /* Your original classnames, styled with Tailwind-like principles */
        .profile-card__avatar {
            width: 5rem;
            height: 5rem;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
        .dark .profile-card__avatar {
            border-color: #334155;
        }

        /* MOBILE-FIRST SLIDING PANELS (max-width: 767px)
          This is the key UI/UX improvement.
        */
        @media (max-width: 767px) {
            .dashboard-shell {
                padding: 1rem 0.5rem 6rem; /* Adjust padding for mobile */
            }
            
            .dashboard-tabs {
                padding: 0.5rem;
                /* Stick tabs to the top on mobile */
                position: sticky;
                top: 0.5rem;
                z-index: 50;
                /* Add a bit of backdrop blur for app-feel */
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                background-color: rgba(255, 255, 255, 0.85);
            }
            .dark .dashboard-tabs {
                 background-color: rgba(30, 41, 59, 0.85);
            }

            .dashboard-panels {
                margin-top: 1rem;
            }

            /* Make #panel-profile stay in place */
            #panel-profile.is-active {
                display: block;
            }

            /* Make all OTHER panels the sliding panels */
            .dashboard-panel:not(#panel-profile) {
                display: block; /* Always rendered */
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh; /* Full screen */
                z-index: 100;
                background-color: #f1f5f9; /* Match body background */
                overflow-y: auto; /* Allow panel to scroll */
                padding: 1rem 1rem 3rem; /* Add padding inside panel */
                
                /* Start off-screen */
                transform: translateX(100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                
                /* Hide the desktop fade-in animation */
                animation: none;
            }
            
            .dark .dashboard-panel:not(#panel-profile) {
                background-color: #0f172a;
            }

            /* When active, slide panel into view */
            .dashboard-panel.is-active:not(#panel-profile) {
                transform: translateX(0);
            }
            
            /* Hide the back button on desktop */
            .panel-back-btn {
                display: inline-flex;
            }
        }
        
    </style>
</head>

                const name = panel?.dataset?.dashboardPanel;
                if (name) {
                    dashboardPanels.set(name, panel);
                }
            });
            // ... (all your other element selections)
            const leaderboardBody = document.getElementById('leaderboard-body'); // Assuming this is elsewhere or not used in tabs
            const leaderboardSortButtons = Array.from(document.querySelectorAll('.leaderboard-sort')); // Same
            
            // === State ===
            let activePanelName = dashboardTabButtons.find(button => button.classList.contains('is-active'))?.dataset?.dashboardTab
                || (dashboardPanels.keys().next().value ?? null);
            // ... (All your other original state variables)
            let medalInventory = [];
            let sortedActivities = [];

            // === Utility Functions ===
            // ... (All your original utility functions: wait, fetchAndValidateJson, etc.)

            // === YOUR ORIGINAL setActivePanel FUNCTION ===
            // This function now works perfectly with the new CSS to create sliding panels.
            function setActivePanel(panelName, { focusTab = false } = {}) {
                if (!panelName || !dashboardPanels.has(panelName)) {
                    return;
                }
        
                if (activePanelName === panelName) {
                    if (focusTab) {
                        const activeButton = dashboardTabButtons.find(button => button.dataset.dashboardTab === panelName);
                        activeButton?.focus();
                    }
                    return;
                }
        
                activePanelName = panelName;
        
                dashboardTabButtons.forEach(button => {
                    const isActive = button.dataset.dashboardTab === panelName;
                    button.classList.toggle('is-active', isActive);
                    button.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    button.setAttribute('tabindex', isActive ? '0' : '-1');
                    if (isActive && focusTab) {
                        // On mobile, blur the tab to hide any focus outline
                        // after sliding the panel in
                        if (window.innerWidth < 768) {
                            button.blur();
                        } else {
                            button.focus();
                        }
                    }
                });
        
                dashboardPanels.forEach((panel, name) => {
                    // This is the core logic:
                    // On desktop, it toggles display: block/none
                    // On mobile, it toggles transform: translateX(0/100%)
                    panel.classList.toggle('is-active', name === panelName);
                });
                
                // When opening a panel, prevent body scroll
                if (window.innerWidth < 768) {
                    if (panelName !== 'profile') {
                        document.body.style.overflow = 'hidden';
                    } else {
                        document.body.style.overflow = ''; // Restore scroll
                    }
                }
            }

            // === Event Listeners ===
            
            // Your original tab click listener
            dashboardTabButtons.forEach((button, index) => {
                if (button.dataset.dashboardTab !== activePanelName) {
                    button.setAttribute('tabindex', '-1');
                }
        
                button.addEventListener('click', () => {
                    setActivePanel(button.dataset.dashboardTab, { focusTab: true });
                });
        
                // ... (your original keydown listener)
            });

            // *** NEW EVENT LISTENER FOR BACK BUTTONS ***
            document.querySelectorAll('.panel-back-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const targetPanel = button.dataset.target || 'profile';
                    setActivePanel(targetPanel, { focusTab: true });
                    // Ensure body scroll is restored
                    document.body.style.overflow = '';
                });
            });
