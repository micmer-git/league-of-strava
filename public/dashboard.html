<!-- public/dashboard.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strava Dashboard</title>
    <!-- Include your CSS here (e.g., Tailwind CSS or Bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom styles if needed */
        .coin {
            display: flex;
            align-items: center;
            margin-right: 1rem;
        }
        .coin span {
            font-size: 1.5rem;
            margin-right: 0.5rem;
        }
        /* Spinner styles */
        .spinner-border {
            border-top-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

    <!-- User Profile Section -->
    <div class="flex items-center p-6">
        <img id="athlete-avatar" src="" alt="Athlete Avatar" class="w-16 h-16 rounded-full mr-4">
        <h1 id="athlete-name" class="text-3xl font-bold"></h1>
    </div>

    <!-- Ranking System Section -->
    <div class="p-6">
        <h2 class="text-2xl font-semibold mb-4">Ranking System</h2>
        <div id="current-rank" class="text-xl mb-2"></div>
        <div class="w-full bg-gray-300 rounded-full h-4 mb-2">
            <div id="ranking-progress" class="bg-blue-500 h-4 rounded-full" style="width: 0%;"></div>
        </div>
        <div id="rank-details" class="text-sm text-gray-600 dark:text-gray-300 mb-2"></div>
        <div id="level-progress" class="text-sm text-gray-600 dark:text-gray-300"></div>
    </div>

    <!-- Coins Section -->
    <div class="flex items-center p-6">
        <div class="coin">
            <span id="coin-dollar">0</span> 💲
        </div>
        <div class="coin">
            <span id="coin-money">0</span> 💰
        </div>
        <div class="coin">
            <span id="coin-bootstrap">0</span> 🔰
        </div>
        <div class="coin">
            <span id="coin-diamond">0</span> 💎
        </div>
        <div class="coin">
            <span id="coin-king">0</span> 👑
        </div>
        <!-- '🏆' coin removed since Segment Coin Section is removed -->
    </div>

    <!-- Activity Counts Section -->
    <div id="activity-counts" class="p-6">
        <!-- Activity counts will be dynamically inserted here -->
    </div>

    <!-- Segments List Section -->
    <div id="segments-list" class="p-6">
        <!-- Segments list will be dynamically inserted here -->
    </div>

    <!-- Achievement Wallet Section -->
    <div id="achievement-wallet" class="p-6">
        <!-- Achievement cards will be dynamically inserted here -->
    </div>

    <!-- Best Activities Section -->
    <div id="best-activities" class="p-6">
        <!-- Best activity cards will be dynamically inserted here -->
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-50 transition-opacity duration-500 opacity-100">
        <div class="spinner-border animate-spin inline-block w-12 h-12 border-4 rounded-full text-white" role="status">
            <span class="sr-only">Loading...</span>
        </div>
        <button id="close-spinner" class="absolute top-4 right-4 text-white text-xl">✖️</button>
    </div>

    <!-- Error Message -->
    <div id="error-message" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white p-4 rounded shadow-lg">
        <!-- Error message will be inserted here -->
    </div>

    <!-- Include your JavaScript -->
    <script src="dashboard.js"></script>
</body>
</html>
