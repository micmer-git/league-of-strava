<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>League of Strava - Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Link to script.js -->
    <script defer src="script.js"></script>

    <style>
        /* Include your existing styles and add styles for new sections */

        /* ... existing styles ... */

        /* Add CSS styles for Wallet, Achievements, and Races sections */
        .wallet-section, .achievements-section, .races-section {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .wallet-section h2, .achievements-section h2, .races-section h2 {
            color: #ff6600;
            margin-bottom: 20px;
        }
        .timeframe-buttons {
            margin-bottom: 20px;
        }
        .timeframe-button {
            padding: 10px 15px;
            margin-right: 10px;
            background-color: #ff6600;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .timeframe-button.active, .timeframe-button:hover {
            background-color: #e03e00;
        }
        .wallet-stats {
            width: 100%;
            border-collapse: collapse;
        }
        .wallet-stats th, .wallet-stats td {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            text-align: left;
        }
        .achievement {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .achievement-emoji {
            font-size: 2em;
            margin-right: 15px;
        }
        .achievement-info h3 {
            margin: 0;
            color: #333;
        }
        .achievement-info p {
            margin: 5px 0;
            color: #555;
        }
    </style>
</head>
<body>
    <!-- ... existing header and navigation ... -->

    <div class="container">
        <!-- Wallet Section -->
        <div class="wallet-section">
            <h2>Wallet</h2>
            <div class="timeframe-buttons">
                <button class="timeframe-button active" data-timeframe="7">Last 7 Days</button>
                <button class="timeframe-button" data-timeframe="14">Last 14 Days</button>
                <button class="timeframe-button" data-timeframe="30">Last 30 Days</button>
                <button class="timeframe-button" data-timeframe="YTD">Year to Date</button>
                <button class="timeframe-button" data-timeframe="365">Last 365 Days</button>
            </div>
            <table class="wallet-stats">
                <tr>
                    <th>Distance</th>
                    <td id="wallet-distance">--</td>
                </tr>
                <tr>
                    <th>Elevation Gain</th>
                    <td id="wallet-elevation">--</td>
                </tr>
                <tr>
                    <th>Moving Time</th>
                    <td id="wallet-time">--</td>
                </tr>
                <tr>
                    <th>Calories</th>
                    <td id="wallet-calories">--</td>
                </tr>
            </table>
        </div>

        <!-- Achievements Section -->
        <div class="achievements-section">
            <h2>Achievements</h2>
            <div id="achievements-container">
                <!-- Achievements will be displayed here -->
            </div>
        </div>

        <!-- Races Section -->
        <div class="races-section">
            <h2>Races</h2>
            <!-- Implement Races section if needed -->
        </div>

    <footer class="footer">
        <div class="container">
            <a href="https://www.strava.com/" target="_blank" rel="noopener">
                <img src="/powered-by-strava.png" alt="Powered by Strava" class="powered-by-strava-logo">
            </a>
        </div>
    </footer>

    <!-- Include the script.js -->
    <script src="script.js"></script>

    <!-- JavaScript for Header Interactivity -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.getElementById('hamburger');
            const mobileNav = document.getElementById('mobile-nav');
            const navMenu = document.getElementById('nav-menu');
            const logo = document.getElementById('logo');

            const toggleMenu = () => {
                hamburger.classList.toggle('active');
                mobileNav.classList.toggle('active');
                const isExpanded = hamburger.classList.contains('active');
                hamburger.setAttribute('aria-expanded', isExpanded);
                mobileNav.style.display = isExpanded ? 'flex' : 'none';
            };

            hamburger.addEventListener('click', toggleMenu);
            logo.addEventListener('click', toggleMenu);

            // Initialize mobile nav display
            mobileNav.style.display = 'none';
        });
    </script>
</body>
</html>
