<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Optional: Error Message -->
        <div id="error-message" class="hidden bg-red-100 text-red-700 p-4 rounded mb-4">
            Failed to load data. Please try again later.
        </div>

        <!-- Top Section: User Info and Coins -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- User Profile -->
            <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
                <div class="flex items-center space-x-4">
                    <img id="athlete-avatar" src="" alt="Athlete Avatar" class="w-16 h-16 rounded-full">
                    <div>
                        <h2 id="athlete-name" class="text-2xl font-bold"></h2>
                    </div>
                </div>
                <div class="mt-4">
                    <h3 class="text-lg font-semibold mb-2">Ranking</h3>
                    <div class="w-full bg-gray-200 rounded-full h-4 dark:bg-gray-700">
                        <div id="ranking-progress" class="bg-blue-600 h-4 rounded-full" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between mt-2">
                        <span id="current-rank" class="text-sm font-medium">Bronze 3</span>
                        <span id="level-progress" class="text-sm font-medium">Level 0/100</span>
                    </div>
                    <!-- Added rank-details element -->
                    <div id="rank-details" class="text-sm text-gray-500 mt-2"></div>
                </div>
            </div>

            <!-- Coins Section -->
            <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
                <h3 class="text-xl font-bold mb-4">Achievement Coins</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-green-50 p-3 rounded-lg flex items-center justify-between">
                        <div>
                            <h4 class="text-sm text-green-600">🏔️ Everest Coins</h4>
                            <span id="everest-coins" class="text-2xl font-bold text-green-800">-</span>
                            <span id="everest-coins-recent" class="text-xs text-green-600">+0 (7d)</span>

                        </div>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-lg flex items-center justify-between">
                        <div>
                            <h4 class="text-sm text-blue-600">❤️ Heartbeat Coins</h4>
                            <span id="heartbeat-coins" class="text-2xl font-bold text-blue-800">-</span>
                            <span id="heartbeat-coins-recent" class="text-xs text-blue-600">+0 (7d)</span>

                        </div>
                    </div>
                    <div class="bg-red-50 p-3 rounded-lg flex items-center justify-between">
                        <div>
                            <h4 class="text-sm text-red-600">🍕 Pizza Coins</h4>
                            <span id="pizza-coins" class="text-2xl font-bold text-red-800">-</span>
                            <span id="pizza-coins-recent" class="text-xs text-red-600">+0 (7d)</span>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Achievement Wallet -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6 mb-8">
            <h3 class="text-xl font-bold mb-4">Achievement Wallet</h3>
            <div id="achievement-wallet" class="grid grid-cols-3 md:grid-cols-3 gap-4">
                <!-- Achievements will be dynamically populated -->
            </div>
        </div>

        <!-- Best Activities -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
            <h3 class="text-xl font-bold mb-4">Top Performances</h3>
            <div id="best-activities" class="space-y-4">
                <!-- Best activities will be dynamically populated -->
            </div>
        </div>
    </div>

    <script src="/dashboard.js"></script>
</body>
</html>
