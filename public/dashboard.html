<!-- public/dashboard.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Dashboard</title>
    <link rel="stylesheet" href="/assets/tailwind.css">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Include a date picker library (optional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="/site-header.js" defer></script>
    <style>
        body {
            font-family: 'Rubik', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #loading-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            /* Initial opacity and transition handled by Tailwind */
        }
        #close-spinner {
            position: absolute;
            top: 20px;
            right: 30px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #4a5568;
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        #close-spinner:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }
        /* Tooltip Styling */
        .tooltip {
            position: relative;
            display: inline-block;
        }
        [title] {
            position: relative;
        }
        [title]:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 8px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            white-space: pre-line;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        [title]:hover::after {
            opacity: 1;
        }

        .tooltip-bubble {
            position: fixed;
            z-index: 9999;
            background-color: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.875rem;
            max-width: 240px;
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.35);
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: opacity 0.15s ease-in-out;
        }

        .tooltip-bubble.visible {
            opacity: 1;
        }

        .profile-metrics {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .profile-metrics__row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .profile-metric-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.45rem 0.7rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
        }

        .profile-metric-pill:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
        }

        .dashboard-onepage {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .dashboard-tabs {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            overflow-x: auto;
            padding: 0.5rem 0.75rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(12px);
        }

        .dashboard-tab {
            border: 1px solid transparent;
            background: transparent;
            padding: 0.45rem 1.2rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1f2937;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .dashboard-tab.is-active {
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: #fff;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
        }

        .dashboard-tab:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        .dashboard-panels {
            position: relative;
        }

        .dashboard-panel {
            display: none;
            animation: panelFade 0.3s ease;
        }

        .dashboard-panel.is-active {
            display: block;
        }

        @keyframes panelFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-card {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .panel-card--soft {
            gap: 1.25rem;
        }

        .panel-card__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .panel-card__header--split {
            align-items: flex-start;
        }

        .panel-card__header--stack {
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .panel-card__header--medals {
            flex-direction: column;
            align-items: flex-start;
            gap: 1rem;
        }

        .panel-card__title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .panel-card__subtitle {
            margin-top: 0.35rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .panel-card__summary-line {
            display: block;
            margin-top: 0.2rem;
        }

        .panel-card__summary-line:first-child {
            margin-top: 0;
        }

        .panel-card__empty {
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .panel-card__footer {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
        }

        .profile-card__header {
            display: flex;
            align-items: flex-start;
            gap: 1.25rem;
        }

        .profile-card__avatar {
            width: 5rem;
            height: 5rem;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
        }

        .profile-card__headline {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex: 1;
            min-width: 0;
        }

        .profile-card__identity {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
        }

        .profile-card__name {
            font-size: clamp(1.65rem, 3vw, 2.1rem);
            font-weight: 700;
            margin: 0;
            color: #0f172a;
            word-break: break-word;
        }

        .profile-card__action {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: linear-gradient(135deg, #f97316, #fb923c);
            color: #fff;
            border: none;
            border-radius: 0.75rem;
            padding: 0.45rem 0.95rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 12px 22px rgba(249, 115, 22, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .profile-card__action:hover,
        .profile-card__action:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 18px 32px rgba(249, 115, 22, 0.35);
            outline: none;
        }

        .profile-card__balance {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.5rem;
            margin: 0;
        }

        .profile-card__balance-label {
            display: none;
        }

        .profile-card__balance-value {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0d9488;
        }

        .profile-card__balance-change {
            font-size: 0.85rem;
            font-weight: 600;
            color: #0f172a;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            background: rgba(34, 197, 94, 0.12);
        }

        .profile-card__balance-change--negative {
            background: rgba(248, 113, 113, 0.16);
            color: #b91c1c;
        }

        .profile-card__balance-change--neutral {
            background: rgba(148, 163, 184, 0.16);
            color: #475569;
        }

        .profile-card__meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            color: #475569;
        }

        .profile-card__badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .profile-card__level {
            font-weight: 700;
            color: #0f172a;
        }

        .profile-card__level-stack {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .profile-card__level-stack span {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.9rem;
            color: #475569;
        }

        .profile-card__level-stack .profile-card__rank {
            font-weight: 600;
            color: #0f172a;
            font-size: 0.95rem;
        }

        .profile-card__level-stack .profile-card__level {
            font-size: 0.85rem;
            color: #1d4ed8;
        }

        .profile-card__coins {
            width: 100%;
        }

        .profile-card__wallet-totals {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .wallet-total-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 0.9rem;
            border-radius: 0.85rem;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.12), rgba(6, 182, 212, 0.08));
            font-weight: 700;
            color: #0f172a;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .wallet-total-pill__icon {
            font-size: 1.25rem;
        }

        .wallet-total-pill__value {
            font-size: 1rem;
        }

        .wallet-total-pill[data-panel-target]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.15);
        }

        .wallet-total-pill:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        .profile-card__progress {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .profile-card__rank {
            color: #0f172a;
        }

        .profile-card__progress-bar {
            position: relative;
            height: 0.9rem;
            border-radius: 9999px;
            background: rgba(148, 163, 184, 0.25);
            overflow: hidden;
        }

        .profile-card__progress-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            transition: width 0.3s ease;
        }

        .profile-card__progress-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.6rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #0f172a;
        }

        .profile-card__progress-label {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .profile-card__progress-next {
            margin-left: auto;
            color: #334155;
            font-weight: 600;
        }

        .profile-card__progress-detail {
            font-size: 0.8rem;
            color: #64748b;
        }

        .top-performances-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 0.75rem;
            align-items: stretch;
        }

        .top-performance-card {
            min-width: 0;
            height: 100%;
        }

        .top-performance-card__content {
            min-width: 0;
        }

        .top-performance-card__title,
        .top-performance-card__value {
            overflow-wrap: anywhere;
        }

        .top-performance-card__action {
            flex-shrink: 0;
        }

        .wallet-table {
            overflow-x: auto;
        }

        .wallet-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .wallet-control {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.9rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(148, 163, 184, 0.4);
            background: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 600;
            color: #1f2937;
            transition: all 0.2s ease;
        }

        .wallet-control[aria-pressed="true"],
        .wallet-control:focus-visible {
            border-color: #2563eb;
            color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            outline: none;
        }

        .wallet-control--toggle {
            cursor: pointer;
        }

        .wallet-control__checkbox {
            width: 1rem;
            height: 1rem;
        }

        .wallet-chart {
            position: relative;
            min-height: 18rem;
        }

        .wallet-chart__empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .filter-banner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
        }

        .filter-banner__label {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            background: rgba(37, 99, 235, 0.12);
            color: #2563eb;
        }

        .filter-banner__active {
            margin-left: auto;
            font-size: 0.75rem;
            color: #64748b;
        }

        .filter-banner__actions {
            display: flex;
            gap: 0.5rem;
        }

        .filter-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.45rem 1.1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .filter-button:hover,
        .filter-button:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.25);
            outline: none;
        }

        .filter-button--ghost {
            background: rgba(148, 163, 184, 0.18);
            color: #1f2937;
        }

        .filter-button[disabled] {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .filter-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }

        .filter-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #475569;
        }

        .filter-field select,
        .filter-field input {
            border: 1px solid rgba(148, 163, 184, 0.5);
            border-radius: 0.65rem;
            padding: 0.45rem 0.65rem;
            font-size: 0.85rem;
            color: #0f172a;
            background: rgba(255, 255, 255, 0.85);
        }

        .filter-field select:focus,
        .filter-field input:focus {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        .filter-range {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .filter-field--range input {
            width: 100%;
        }

        .activities-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .medals-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .medals-category {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .medals-category__title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #475569;
        }

        .dark .medals-category__title,
        body.dark .medals-category__title {
            color: rgba(226, 232, 240, 0.85);
        }

        .medals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.75rem;
        }

        @media (min-width: 1024px) {
            .medals-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
        }

        .medal-badge {
            transition: box-shadow 0.2s ease;
        }

        .medal-badge:hover {
            box-shadow: 0 12px 20px rgba(15, 23, 42, 0.18);
        }

        .leaderboard-table-wrapper {
            overflow-x: auto;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 52rem;
            font-size: 0.75rem;
        }

        .leaderboard-table thead th {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.92);
            font-weight: 700;
            padding: 0.6rem;
            text-align: left;
            color: #0f172a;
            border-bottom: 1px solid rgba(148, 163, 184, 0.3);
        }

        .leaderboard-table tbody td {
            padding: 0.55rem 0.6rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            color: #1f2937;
        }

        .leaderboard-table tbody tr:last-child td {
            border-bottom: none;
        }

        .leaderboard-sort {
            border: none;
            background: transparent;
            font: inherit;
            color: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .leaderboard-sort::after {
            content: '\25B4';
            font-size: 0.65rem;
            opacity: 0;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .leaderboard-sort[data-direction="desc"]::after {
            transform: rotate(180deg);
        }

        .leaderboard-sort.is-active::after {
            opacity: 1;
        }

        .leaderboard-athlete-link {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .leaderboard-athlete-link:hover,
        .leaderboard-athlete-link:focus-visible {
            text-decoration: underline;
            outline: none;
        }

        .leaderboard-rank {
            font-weight: 700;
            color: #475569;
        }

        @media (min-width: 1024px) {
            .panel-stack {
                gap: 2rem;
            }
        }

        @media (prefers-color-scheme: dark) {
            .dashboard-tabs {
                background: rgba(15, 23, 42, 0.75);
                box-shadow: 0 12px 32px rgba(8, 47, 73, 0.45);
            }

            .dashboard-tab {
                color: #e2e8f0;
            }

            .panel-card__title,
            .profile-card__name,
            .profile-card__level,
            .profile-card__rank {
                color: #e2e8f0;
            }

            .panel-card__subtitle,
            .profile-card__balance,
            .profile-card__progress-detail,
            .panel-card__empty {
                color: #cbd5f5;
            }

            .profile-card__balance-value {
                color: #5eead4;
            }

            .wallet-control {
                background: rgba(15, 23, 42, 0.75);
                border-color: rgba(148, 163, 184, 0.3);
                color: #e2e8f0;
            }

            .filter-field select,
            .filter-field input {
                background: rgba(15, 23, 42, 0.75);
                color: #e2e8f0;
                border-color: rgba(148, 163, 184, 0.35);
            }

            .wallet-total-pill {
                background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(15, 118, 110, 0.18));
                color: #e2e8f0;
            }

            .medal-banner {
                background: rgba(37, 99, 235, 0.22);
                color: #bfdbfe;
            }

            .leaderboard-table thead th {
                background: rgba(15, 23, 42, 0.92);
                color: #e2e8f0;
            }

            .leaderboard-table tbody td {
                color: #cbd5f5;
            }

            .leaderboard-athlete-link {
                color: #60a5fa;
            }

            .leaderboard-rank {
                color: #cbd5f5;
            }
        }
        /* Neuromorphic refresh */
        body.dashboard-body {
            display: flex;
            flex-direction: column;
            color: var(--color-text);
        }

        .dashboard-shell {
            flex: 1;
            width: min(1180px, 94vw);
            margin: 0 auto;
            padding: clamp(2rem, 5vw, 4rem) 0 clamp(2.5rem, 6vw, 4.5rem);
            display: grid;
            gap: clamp(2rem, 4vw, 3.25rem);
        }

        #error-message {
            background: rgba(225, 84, 93, 0.12);
            border: 1px solid rgba(225, 84, 93, 0.35);
            border-radius: var(--radius-md);
            color: var(--color-danger);
            box-shadow: var(--shadow-soft);
            padding: 1rem 1.25rem;
        }

        #loading-spinner {
            background: rgba(241, 244, 255, 0.82);
            backdrop-filter: blur(12px);
        }

        #close-spinner {
            color: var(--color-text-soft);
            border-radius: var(--radius-sm);
        }

        #close-spinner:hover {
            background: var(--color-accent-soft);
            color: var(--color-text-strong);
        }

        .dashboard-onepage {
            gap: clamp(1.75rem, 4vw, 2.6rem);
        }

        .dashboard-tabs {
            background: var(--color-surface);
            border-radius: 999px;

                                <button id="load-more-btn" type="button" class="filter-button hidden">Load More Activities</button>
                            </div>
                        </section>
                    </div>
                </section>

                <section id="panel-medals" class="dashboard-panel" role="tabpanel" aria-labelledby="tab-medals" data-dashboard-panel="medals">
                    <div class="panel-card panel-card--soft bg-white/95 dark:bg-gray-800/95 shadow-lg rounded-2xl">
                        <header class="panel-card__header panel-card__header--medals">
                            <h3 class="panel-card__title">Medals</h3>
                            <div id="medal-filter-banner" class="medal-banner hidden">
                                <div class="medal-banner__header">
                                    <span id="medal-filter-emoji" class="medal-banner__emoji"></span>
                                    <span id="medal-filter-label" class="medal-banner__label"></span>
                                </div>
                                <div class="medal-banner__meta">
                                    <span id="medal-filter-description"></span>
                                </div>
                            </div>
                        </header>
                        <div id="medals-section" class="medals-section"></div>
                        <div class="panel-card__footer">
                            <button id="medals-load-more" type="button" class="filter-button filter-button--ghost">Load more medals</button>
                        </div>
                    </div>
                </section>

            </div>
        </div>
        <div id="segment-completions" class="mt-6 hidden">
            <h2 class="text-xl font-bold mb-4">Segment Completions</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Multiple segments will be populated here -->
            </div>
        </div>

    </main>
    <script src="/dashboard.js"></script>
</body>
</html>
