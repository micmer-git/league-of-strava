<!-- public/dashboard.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Include a date picker library (optional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        #loading-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            /* Initial opacity and transition handled by Tailwind */
        }
        #close-spinner {
            position: absolute;
            top: 20px;
            right: 30px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #4a5568;
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        #close-spinner:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }
        /* Tooltip Styling */
        .tooltip {
            position: relative;
            display: inline-block;
        }
        [title] {
            position: relative;
        }
        [title]:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 8px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            white-space: pre-line;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        [title]:hover::after {
            opacity: 1;
        }

        .tooltip-bubble {
            position: fixed;
            z-index: 9999;
            background-color: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.875rem;
            max-width: 240px;
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.35);
            opacity: 0;
            transform: translate(-50%, 0);
            transition: opacity 0.15s ease-in-out;
        }

        .tooltip-bubble.visible {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white">
    <!-- Loading Spinner -->
    <div id="loading-spinner" class="hidden opacity-0 transition-opacity duration-500 ease-in-out">
        <div class="relative flex flex-col items-center">
            <button id="close-spinner" aria-label="Close Loading Spinner">×</button>
            <svg class="animate-spin h-16 w-16 text-blue-600 mt-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <!-- Error Message -->
        <div id="error-message" class="hidden bg-red-100 text-red-700 p-4 rounded mb-4"></div>

        <!-- Top Section: User Info and Coins -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- User Profile -->
            <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
                <div class="flex items-center space-x-4">
                    <img id="athlete-avatar" src="" alt="Athlete Avatar" class="w-16 h-16 rounded-full">
                    <div>
                        <h2 id="athlete-name" class="text-2xl font-bold"></h2>
                    </div>
                </div>
                <div class="mt-4">
                    <div class="w-full bg-gray-200 rounded-full h-4 dark:bg-gray-700">
                        <div id="ranking-progress" class="bg-blue-600 h-4 rounded-full" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between mt-2">
                        <span id="current-rank" class="text-sm font-medium"></span>
                        <span id="level-progress" class="text-sm font-medium"></span>
                    </div>
                    <div id="rank-details" class="text-sm text-gray-500 mt-2"></div>
                </div>
            </div>

            <!-- Coins Section -->
            <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
                <h3 class="text-xl font-bold mb-4">Your Coins</h3>
                <div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-2 sm:gap-3">
                    <!-- Coins with count below emojis and descriptions on hover/click -->
                    <button type="button" class="flex flex-col items-center gap-1 text-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 tooltip-target"
                            data-tooltip="Basic achievement coins\nEarned from completing regular activities">
                        <span class="text-2xl sm:text-3xl">💲</span>
                        <span id="coin-dollar" class="text-sm sm:text-base font-bold text-green-800">0</span>
                    </button>
                    <button type="button" class="flex flex-col items-center gap-1 text-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 tooltip-target"
                            data-tooltip="Weekly achievement coins\nEarned from completing weekly challenges">
                        <span class="text-2xl sm:text-3xl">💰</span>
                        <span id="coin-money" class="text-sm sm:text-base font-bold text-blue-800">0</span>
                    </button>
                    <button type="button" class="flex flex-col items-center gap-1 text-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 tooltip-target"
                            data-tooltip="Milestone achievement coins\nEarned from reaching distance milestones">
                        <span class="text-2xl sm:text-3xl">🔰</span>
                        <span id="coin-bootstrap" class="text-sm sm:text-base font-bold text-yellow-800">0</span>
                    </button>
                    <button type="button" class="flex flex-col items-center gap-1 text-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 tooltip-target"
                            data-tooltip="Ultra achievement coins\nEarned from completing ultra-distance challenges">
                        <span class="text-2xl sm:text-3xl">💎</span>
                        <span id="coin-diamond" class="text-sm sm:text-base font-bold text-purple-800">0</span>
                    </button>
                    <button type="button" class="flex flex-col items-center gap-1 text-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 tooltip-target"
                            data-tooltip="Elite achievement coins\nEarned from exceptional performances">
                        <span class="text-2xl sm:text-3xl">👑</span>
                        <span id="coin-king" class="text-sm sm:text-base font-bold text-red-800">0</span>
                    </button>
                    <button type="button" class="flex flex-col items-center gap-1 text-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 tooltip-target"
                            data-tooltip="Trophy coins\nEarned from outstanding achievements">
                        <span class="text-2xl sm:text-3xl">🏆</span>
                        <span id="coin-trophy" class="text-sm sm:text-base font-bold text-yellow-800">0</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Date Filtering Section -->
        <div class="flex justify-end mb-6">
            <div class="flex space-x-2">
                <select id="year-select" class="px-4 py-2 border rounded"></select>
                <input type="text" id="start-date" placeholder="Start Date" class="px-4 py-2 border rounded">
                <input type="text" id="end-date" placeholder="End Date" class="px-4 py-2 border rounded">
                <button id="filter-button" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Filter</button>
                <button id="reset-button" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">Reset</button>
            </div>
        </div>

        <!-- Achievement Wallet -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6 mb-8">
            <h3 class="text-xl font-bold mb-4">Achievement Wallet</h3>
            <div id="achievement-wallet" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
                <!-- Achievements will be dynamically populated -->
            </div>
        </div>

        <!-- Medals Section -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6 mb-8">
            <h3 class="text-xl font-bold mb-4">Medals</h3>
            <div id="medals-section" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4">
                <!-- Medals will be dynamically populated -->
            </div>
        </div>

        <!-- Segment Completions Section -->
        <div id="segment-completions" class="mt-6">
            <h2 class="text-xl font-bold mb-4">Segment Completions</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Multiple segments will be populated here -->
            </div>
        </div>

        <!-- Best Activities -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
            <h3 class="text-xl font-bold mb-4">Top Performances</h3>
            <div id="best-activities" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Best activities will be dynamically populated -->
            </div>
        </div>
        <div id="activities-section" class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6 mt-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold">Recent Activities</h3>
                <span id="activities-empty" class="hidden text-sm text-gray-500">No activities match your filters.</span>
            </div>
            <div id="activities-container" class="space-y-3"></div>
            <button id="load-more-btn" type="button" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded mt-6 ml-auto hidden">Load More Activities</button>
        </div>
    </div>

    <script src="/dashboard.js"></script>
</body>
</html>
