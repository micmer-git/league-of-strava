<!-- public/dashboard.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Include a date picker library (optional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        #loading-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            /* Initial opacity and transition handled by Tailwind */
        }
        #close-spinner {
            position: absolute;
            top: 20px;
            right: 30px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #4a5568;
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        #close-spinner:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }
        /* Tooltip Styling */
        .tooltip {
            position: relative;
            display: inline-block;
        }
        [title] {
            position: relative;
        }
        [title]:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 8px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            white-space: pre-line;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        [title]:hover::after {
            opacity: 1;
        }

        .tooltip-bubble {
            position: fixed;
            z-index: 9999;
            background-color: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.875rem;
            max-width: 240px;
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.35);
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: opacity 0.15s ease-in-out;
        }

        .tooltip-bubble.visible {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white">
    <!-- Loading Spinner -->
    <div id="loading-spinner" class="hidden opacity-0 transition-opacity duration-500 ease-in-out">
        <div class="relative flex flex-col items-center">
            <button id="close-spinner" aria-label="Close Loading Spinner">×</button>
            <svg class="animate-spin h-16 w-16 text-blue-600 mt-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <!-- Error Message -->
        <div id="error-message" class="hidden bg-red-100 text-red-700 p-4 rounded mb-4"></div>

        <!-- Filter Bar -->
        <div class="sticky top-0 z-30 mb-6">
            <div class="bg-white/95 dark:bg-gray-800/95 shadow-xl rounded-lg px-4 sm:px-5 py-3 backdrop-blur supports-backdrop-blur:border border-gray-200/40 dark:border-gray-700/40">
                <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
                    <label class="flex flex-col gap-1 text-xs font-semibold uppercase tracking-wide text-gray-600 dark:text-gray-300">
                        <span>Year</span>
                        <select id="year-select" class="rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-w-[10rem]"></select>
                    </label>
                    <p class="text-xs text-gray-500 dark:text-gray-400 sm:text-right">Choose a year or select “All Years” to view your complete history.</p>
                </div>
            </div>
        </div>

        <!-- Top Section: User Info and Coins -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- User Profile -->
            <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
                <div class="flex items-center space-x-4">
                    <img id="athlete-avatar" src="" alt="Athlete Avatar" class="w-16 h-16 rounded-full">
                    <div>
                        <div class="flex flex-col sm:flex-row sm:items-center sm:gap-3">
                            <h2 id="athlete-name" class="text-2xl font-bold"></h2>
                            <button id="fetch-more-data" type="button" class="mt-2 sm:mt-0 inline-flex items-center gap-2 bg-amber-500/90 hover:bg-amber-500 text-white text-sm sm:text-base font-semibold px-3 py-1.5 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-amber-300">
                                <span aria-hidden="true">🔁</span>
                                <span>Fetch more data</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <div class="flex flex-wrap items-center justify-between gap-2 text-sm font-medium text-gray-600 dark:text-gray-300">
                        <div id="premium-achievements" class="flex flex-wrap items-center gap-1"></div>
                        <span id="level-progress" class="text-sm font-semibold text-gray-700 dark:text-gray-200"></span>
                    </div>
                    <div class="mt-3 space-y-2">
                        <div class="flex items-center justify-between text-sm font-semibold text-gray-700 dark:text-gray-200">
                            <span id="current-rank" class="flex items-center gap-1"></span>
                            <span id="next-rank" class="flex items-center gap-1 text-right"></span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3 dark:bg-gray-700">
                            <div id="ranking-progress" class="bg-blue-600 h-3 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                    <div id="rank-details" class="text-sm text-gray-500 mt-2"></div>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <button id="globe-stat" type="button" class="tooltip-target inline-flex items-center gap-2 bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-200 px-3 py-1.5 rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-400">
                            <span aria-hidden="true">🌍</span>
                            <span id="globe-total">0</span>
                        </button>
                        <button id="everest-stat" type="button" class="tooltip-target inline-flex items-center gap-2 bg-emerald-50 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-200 px-3 py-1.5 rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-400">
                            <span aria-hidden="true">🏔️</span>
                            <span id="everest-total">0</span>
                        </button>
                        <button id="pizza-stat" type="button" class="tooltip-target inline-flex items-center gap-2 bg-orange-50 dark:bg-orange-900/40 text-orange-700 dark:text-orange-200 px-3 py-1.5 rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-orange-400">
                            <span aria-hidden="true">🍕</span>
                            <span id="pizza-total">0</span>
                        </button>
                    </div>
                </div>
            </div>

        <!-- Coins Section -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-xl font-bold">Your Coins</h3>
                <div class="text-sm sm:text-base font-semibold text-emerald-600 dark:text-emerald-300">Total haul: <span id="coin-total-value">$0.00M</span></div>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1" id="coin-summary">
                    <button type="button" class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-center rounded-md bg-gray-100 dark:bg-gray-700/70 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                        <span class="text-2xl sm:text-3xl leading-none">💲</span>
                        <span id="coin-dollar" class="text-sm sm:text-base font-bold text-green-700 dark:text-green-300">0</span>
                    </button>
                    <button type="button" class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-center rounded-md bg-gray-100 dark:bg-gray-700/70 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                        <span class="text-2xl sm:text-3xl leading-none">💰</span>
                        <span id="coin-money" class="text-sm sm:text-base font-bold text-blue-700 dark:text-blue-300">0</span>
                    </button>
                    <button type="button" class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-center rounded-md bg-gray-100 dark:bg-gray-700/70 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                        <span class="text-2xl sm:text-3xl leading-none">🧈</span>
                        <span id="coin-butter" class="text-sm sm:text-base font-bold text-amber-700 dark:text-amber-300">0</span>
                    </button>
                    <button type="button" class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-center rounded-md bg-gray-100 dark:bg-gray-700/70 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                        <span class="text-2xl sm:text-3xl leading-none">💎</span>
                        <span id="coin-diamond" class="text-sm sm:text-base font-bold text-purple-700 dark:text-purple-300">0</span>
                    </button>
                    <button type="button" class="flex flex-col items-center justify-center gap-1 px-3 py-2 text-center rounded-md bg-gray-100 dark:bg-gray-700/70 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                        <span class="text-2xl sm:text-3xl leading-none">👑</span>
                        <span id="coin-king" class="text-sm sm:text-base font-bold text-red-700 dark:text-red-300">0</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Medal & Treasure Insights -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-3xl p-6 md:p-8 mb-8">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
                <div>
                    <h3 class="text-2xl font-bold tracking-tight">Medal Treasury</h3>
                    <p id="chart-subtitle" class="text-sm text-slate-500 dark:text-slate-300 mt-1">Chart will appear once we crunch your activities.</p>
                </div>
                <div class="inline-flex items-center gap-1 rounded-full bg-slate-100 dark:bg-slate-700/60 p-1" role="group" aria-label="Medal and dollar chart mode">
                    <button type="button" data-chart-mode="medals" class="chart-mode-btn px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-full text-slate-600 dark:text-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">Medals</button>
                    <button type="button" data-chart-mode="dollars" class="chart-mode-btn px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-full text-slate-600 dark:text-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">Cumulative $</button>
                </div>
            </div>

            <div class="mt-6">
                <div id="yearly-insights-slider" class="flex gap-3 overflow-x-auto pb-2 snap-x snap-mandatory" aria-label="Yearly medal highlights">
                    <!-- Yearly highlight chips will be rendered here -->
                </div>
            </div>

            <div class="mt-6">
                <div class="relative w-full h-64 sm:h-72">
                    <canvas id="medal-dollar-chart" class="absolute inset-0"></canvas>
                </div>
            </div>

            <div id="special-medal-strip" class="mt-6 flex gap-2 overflow-x-auto pb-1 snap-x snap-mandatory" aria-label="Special medals">
                <!-- Special medals will be injected here -->
            </div>
        </div>

        <!-- Achievement Wallet -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6 mb-8">
            <div id="achievement-wallet" class="overflow-x-auto">
                <!-- Achievements will be dynamically populated -->
            </div>
        </div>

        <!-- Medals Section -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6 mb-8">
            <h3 class="text-xl font-bold mb-4">Medals</h3>
            <div id="medals-section" class="flex gap-3 sm:gap-4 overflow-x-auto pb-2 snap-x snap-mandatory">
                <!-- Medals will be dynamically populated -->
            </div>
        </div>

        <!-- Segment Completions Section -->
        <div id="segment-completions" class="mt-6 hidden">
            <h2 class="text-xl font-bold mb-4">Segment Completions</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Multiple segments will be populated here -->
            </div>
        </div>

        <!-- Best Activities -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">
            <h3 class="text-xl font-bold mb-4">Top Performances</h3>
            <div id="best-activities" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Best activities will be dynamically populated -->
            </div>
        </div>
        <div id="activities-section" class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6 mt-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold">Recent Activities</h3>
                <span id="activities-empty" class="hidden text-sm text-gray-500">No activities match your filters.</span>
            </div>
            <div id="activities-container" class="space-y-3"></div>
            <button id="load-more-btn" type="button" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded mt-6 ml-auto hidden">Load More Activities</button>
        </div>
    </div>

    <script src="/dashboard.js"></script>
</body>
</html>
