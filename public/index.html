<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>League of Strava - Upload Your Activities</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/kTcX2a6gVgkG3M3OQ/OQ5rQeM1gq6p5Zb5xM8Z5iw8m1vZ8ENJkKHLYb9YQho4ELtB1AmPrkCl/wg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* Basic Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container Styling */
        .container {
            max-width: 1200px;
            width: 100%;
            padding: 20px;
        }

        /* Centered Introduction Section */
        .introduction-section {
            background-color: #fff;
            padding: 40px 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .introduction-section h2 {
            color: #ff6600;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .introduction-section p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 15px;
        }

        /* Form Container */
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .form-container h3 {
            color: #ff6600;
        }

        .strava-connect-btn {
            display: inline-flex;
            align-items: center;
            background-color: #fc4c02;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s;
            margin-top: 20px;
        }

        .strava-connect-btn:hover {
            background-color: #e03e00;
        }

        /* Footer Styling */
        .footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }

        .powered-by-strava-logo {
            height: 30px;
            width: auto;
        }

    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a href="/" class="site-header__brand">
                <img src="/static/league-of-strava.png" alt="League of Strava logo">
                <span class="site-header__brand-text">League of Strava</span>
            </a>
            <nav class="site-header__nav" aria-label="Primary navigation">
                <a href="/" aria-current="page">Home</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/leaderboard">Leaderboard</a>
                <a href="https://www.paypal.com/paypalme/michelemerelli" target="_blank" rel="noopener">Donate</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="introduction-section">
            <h2>Welcome to League of Strava</h2>
            <p>Earn experience and begin your journey towards <strong>Master Prestige 100</strong></p>
        </div>

        <div class="form-container">
            <h3>Directly link your Strava</h3>
            <a href="/auth/strava" class="strava-connect-btn">
                <i class="fab fa-strava"></i> Connect with Strava
            </a>
        </div>
    </div>

    <footer class="footer">
        <a href="https://www.strava.com/" target="_blank" rel="noopener">
            <img src="static/powered-by-strava.png" alt="Powered by Strava" class="powered-by-strava-logo">
        </a>
    </footer>

</body>
</html>
