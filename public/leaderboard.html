<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>League of Strava - Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/leaderboard.js" defer></script>
</head>
<body class="leaderboard-body">
  <main class="leaderboard-main">
    <section class="leaderboard-container" aria-labelledby="leaderboard-heading">
      <header class="leaderboard-header">
        <h1 id="leaderboard-heading">Global Leaderboard</h1>
      </header>
      <div class="leaderboard-table-wrapper" role="region" aria-labelledby="leaderboard-heading" tabindex="0">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th scope="col">
                <span aria-hidden="true">#</span>
                <span class="sr-only">Rank</span>
              </th>
              <th scope="col">
                <span aria-hidden="true">🧑‍🚀</span>
                <span class="sr-only">Athlete</span>
              </th>
              <th scope="col">
                <span>Level</span>
              </th>
              <th scope="col">
                <span>Balance</span>
              </th>
              <th scope="col" class="stat-cell">
                <span aria-hidden="true">🌍</span>
                <span class="sr-only">World trips</span>
              </th>
              <th scope="col" class="stat-cell">
                <span aria-hidden="true">🏔️</span>
                <span class="sr-only">Everest summits</span>
              </th>
              <th scope="col" class="stat-cell">
                <span aria-hidden="true">🍕</span>
                <span class="sr-only">Pizza slices</span>
              </th>
              <th scope="col" class="stat-cell">
                <span aria-hidden="true">💲</span>
                <span class="sr-only">Dollar coins</span>
              </th>
              <th scope="col" class="stat-cell">
                <span aria-hidden="true">💰</span>
                <span class="sr-only">Vault coins</span>
              </th>
              <th scope="col" class="stat-cell">
                <span aria-hidden="true">🧈</span>
                <span class="sr-only">Butter coins</span>
              </th>
              <th scope="col" class="stat-cell">
                <span aria-hidden="true">💎</span>
                <span class="sr-only">Diamond coins</span>
              </th>
              <th scope="col" class="stat-cell">
                <span aria-hidden="true">👑</span>
                <span class="sr-only">Crown coins</span>
              </th>
              <th scope="col">
                <span aria-hidden="true">⏱️</span>
                <span class="sr-only">Last updated</span>
              </th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
      <div id="leaderboard-cards" class="leaderboard-cards" hidden></div>
    </section>
  </main>
</body>
</html>
