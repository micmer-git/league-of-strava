<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>League of Strava - Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/site-header.js" defer></script>
  <script src="/leaderboard.js" defer></script>
</head>
<body class="leaderboard-body">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="/">
        <img src="/static/league-of-strava.png" alt="League of Strava logo">
        <span class="site-header__brand-text">League of Strava</span>
      </a>
      <button id="site-nav-toggle" class="site-header__toggle" type="button" aria-expanded="false" aria-controls="site-primary-nav">
        <span class="sr-only">Toggle navigation</span>
        <span class="site-header__toggle-bars" aria-hidden="true"></span>
        <span aria-hidden="true">Menu</span>
      </button>
      <nav id="site-primary-nav" class="site-header__nav" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/leaderboard" aria-current="page">Leaderboard</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </header>
  <main class="leaderboard-main">
    <section class="leaderboard-container" aria-labelledby="leaderboard-heading">
      <h1 id="leaderboard-heading" class="sr-only">Global Leaderboard</h1>
      <div class="leaderboard-controls">
        <label for="leaderboard-search" class="leaderboard-controls__label">Find athlete</label>
        <input id="leaderboard-search" type="search" class="leaderboard-controls__input" placeholder="Search by name or Strava ID" autocomplete="off">
        <button id="leaderboard-search-clear" type="button" class="leaderboard-controls__clear" aria-label="Clear search" hidden>Clear</button>
        <p id="leaderboard-search-meta" class="leaderboard-controls__meta" aria-live="polite"></p>
      </div>
      <div class="leaderboard-table-wrapper" role="region" aria-labelledby="leaderboard-heading" tabindex="0">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th scope="col">
                <span aria-hidden="true">#</span>
                <span class="sr-only">Rank</span>
              </th>
              <th scope="col">
                <span aria-hidden="true">🧑‍🚀</span>
                <span class="sr-only">Athlete</span>
              </th>
              <th scope="col">
                <button type="button" class="leaderboard-sort-button" data-sort-key="overall">
                  <span>Level</span>
                  <span class="sr-only">Sort by level ranking</span>
                </button>
              </th>
              <th scope="col">
                <span>Balance</span>
              </th>
              <th scope="col" class="stat-cell">
                <button type="button" class="leaderboard-sort-button" data-sort-key="worldTrips">
                  <span aria-hidden="true">🌍</span>
                  <span class="sr-only">Sort by world trips</span>
                </button>
              </th>
              <th scope="col" class="stat-cell">
                <button type="button" class="leaderboard-sort-button" data-sort-key="everestSummits">
                  <span aria-hidden="true">🏔️</span>
                  <span class="sr-only">Sort by Everest summits</span>
                </button>
              </th>
              <th scope="col" class="stat-cell">
                <button type="button" class="leaderboard-sort-button" data-sort-key="pizzas">
                  <span aria-hidden="true">🍕</span>
                  <span class="sr-only">Sort by pizzas</span>
                </button>
              </th>
              <th scope="col" class="stat-cell">
                <button type="button" class="leaderboard-sort-button" data-sort-key="coin:💲">
                  <span aria-hidden="true">💲</span>
                  <span class="sr-only">Sort by dollar coins</span>
                </button>
              </th>
              <th scope="col" class="stat-cell">
                <button type="button" class="leaderboard-sort-button" data-sort-key="coin:💰">
                  <span aria-hidden="true">💰</span>
                  <span class="sr-only">Sort by vault coins</span>
                </button>
              </th>
              <th scope="col" class="stat-cell">
                <button type="button" class="leaderboard-sort-button" data-sort-key="coin:🧈">
                  <span aria-hidden="true">🧈</span>
                  <span class="sr-only">Sort by butter coins</span>
                </button>
              </th>
              <th scope="col" class="stat-cell">
                <button type="button" class="leaderboard-sort-button" data-sort-key="coin:💎">
                  <span aria-hidden="true">💎</span>
                  <span class="sr-only">Sort by diamond coins</span>
                </button>
              </th>
              <th scope="col" class="stat-cell">
                <button type="button" class="leaderboard-sort-button" data-sort-key="coin:👑">
                  <span aria-hidden="true">👑</span>
                  <span class="sr-only">Sort by crown coins</span>
                </button>
              </th>
              <th scope="col">
                <button type="button" class="leaderboard-sort-button" data-sort-key="updated">
                  <span aria-hidden="true">⏱️</span>
                  <span class="sr-only">Sort by last updated</span>
                </button>
              </th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
      <div id="leaderboard-cards" class="leaderboard-cards" hidden></div>
    </section>
  </main>
</body>
</html>
