<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Strava - Leaderboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/site-header.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script src="/site-header.js" defer></script>
    <script src="/install.js" defer></script>
    <script src="/leaderboard.js" defer></script>

    <style>
        body { font-family: 'Google Sans', 'Inter', system-ui, sans-serif; background-color: #FAFAFA; color: #1f2937; overflow-x: hidden; }
        h1, h2, h3, .font-heading { font-family: 'Google Sans', 'Inter', system-ui, sans-serif; }
        
        /* Theme Utilities */
        .text-strava { color: #fc4c02; }
        .bg-strava { background-color: #fc4c02; }
        
        /* Navigation & Animations */
        .btn-primary {
            background: linear-gradient(135deg, #fc4c02, #ea3e00);
            color: white;
            transition: transform 0.2s;
        }
        .btn-primary:hover { transform: scale(1.02); }

        /* Bento Card Styles */
        .bento-card {
            background: white;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-radius: 1.5rem; /* rounded-3xl */
            overflow: hidden;
        }

        /* Custom Table Styling to match Tailwind aesthetics 
           Since rows are generated by JS, we style tags directly within the table ID */
        #leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        #leaderboard-table thead th {
            background-color: #f9fafb; /* gray-50 */
            color: #6b7280; /* gray-500 */
            font-size: 0.75rem; /* text-xs */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        #leaderboard-table tbody tr {
            border-bottom: 1px solid #f3f4f6;
            transition: background-color 0.2s;
        }

        #leaderboard-table tbody tr:hover {
            background-color: #fff7ed; /* orange-50 (very light) on hover */
        }

        #leaderboard-table tbody td {
            padding: 1rem 1.5rem;
            font-size: 0.875rem; /* text-sm */
            color: #374151; /* gray-700 */
            vertical-align: middle;
        }

        /* Helper for center aligned columns */
        .stat-cell, 
        #leaderboard-table tbody td:nth-child(n+4) { 
            text-align: center; 
        }

        /* Sort Button Reset */
        .leaderboard-sort-button {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: inherit;
            color: inherit;
            text-transform: inherit;
            font-size: inherit;
            letter-spacing: inherit;
        }
        .leaderboard-sort-button:hover {
            color: #fc4c02;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__brand" href="/">
                <img src="/logo.png" alt="League of Strava logo" onerror="this.src='/static/league-of-strava.png'">
                <span class="site-header__brand-text">League of Strava</span>
            </a>
            <button aria-controls="site-primary-nav" aria-expanded="false" class="site-header__toggle" id="site-nav-toggle" type="button">
                <span class="sr-only">Toggle navigation</span>
                <span aria-hidden="true" class="site-header__toggle-bars"></span>
                <span aria-hidden="true">Menu</span>
            </button>
            <nav aria-label="Primary navigation" class="site-header__nav" id="site-primary-nav">
                <a href="/">Home</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/leaderboard" aria-current="page">Leaderboard</a>
                <a href="/contact">Contact</a>
                <button type="button" class="site-header__install" data-install-trigger>Install app</button>
                <a href="/auth/strava?redirect=%2Fleaderboard" class="site-header__cta">
                    Connect Strava
                </a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12 md:py-16 max-w-7xl flex-grow">
        
        <div class="text-center mb-12 opacity-0 hero-elem">
            <h1 class="text-4xl md:text-6xl font-heading font-extrabold mb-4 text-gray-900">
                Global Standings
            </h1>
            <p class="text-lg text-gray-500 max-w-2xl mx-auto">
                Compare your stats, coins, and summits against the league.
            </p>
        </div>

        <div class="bento-card opacity-0 grid-card min-h-[500px]">
            <div class="leaderboard-table-wrapper overflow-x-auto">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th scope="col" class="w-16 text-center">
                                #
                            </th>
                            <th scope="col">
                                Athlete
                            </th>
                            <th scope="col">
                                <button type="button" class="leaderboard-sort-button" data-sort-key="overall">
                                    <span>Level</span>
                                    <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                            </th>
                            <th scope="col" class="stat-cell">
                                <span>Balance</span>
                            </th>
                            <th scope="col" class="stat-cell">
                                <button type="button" class="leaderboard-sort-button justify-center" data-sort-key="worldTrips">
                                    <span class="text-xl">🌍</span>
                                </button>
                            </th>
                            <th scope="col" class="stat-cell">
                                <button type="button" class="leaderboard-sort-button justify-center" data-sort-key="everestSummits">
                                    <span class="text-xl">🏔️</span>
                                </button>
                            </th>
                            <th scope="col" class="stat-cell">
                                <button type="button" class="leaderboard-sort-button justify-center" data-sort-key="pizzas">
                                    <span class="text-xl">🍕</span>
                                </button>
                            </th>
                            <th scope="col" class="stat-cell">
                                <button type="button" class="leaderboard-sort-button justify-center" data-sort-key="coin:💲">
                                    <span class="text-xl">💲</span>
                                </button>
                            </th>
                            <th scope="col" class="stat-cell">
                                <button type="button" class="leaderboard-sort-button justify-center" data-sort-key="coin:💰">
                                    <span class="text-xl">💰</span>
                                </button>
                            </th>
                            <th scope="col" class="stat-cell">
                                <button type="button" class="leaderboard-sort-button justify-center" data-sort-key="coin:💎">
                                    <span class="text-xl">💎</span>
                                </button>
                            </th>
                            <th scope="col" class="stat-cell">
                                <button type="button" class="leaderboard-sort-button justify-center" data-sort-key="coin:👑">
                                    <span class="text-xl">👑</span>
                                </button>
                            </th>
                            <th scope="col" class="stat-cell text-right">
                                <button type="button" class="leaderboard-sort-button justify-center" data-sort-key="updated">
                                    <span class="text-xl">⏱️</span>
                                </button>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="mt-auto border-t border-gray-200 py-12 bg-white">
        <div class="container mx-auto px-6 text-center">
            <div class="flex justify-center items-center gap-2 mb-6 opacity-50">
                <img src="/static/league-of-strava.png" class="w-6 h-6 grayscale">
                <span class="font-heading font-bold text-gray-400">LOS</span>
            </div>
            <p class="text-gray-400 text-sm mb-6">&copy; 2024 League of Strava.</p>
            <div class="flex justify-center gap-8 text-sm font-semibold text-gray-500">
                <a href="/leaderboard" class="hover:text-strava">Leaderboard</a>
                <a href="/contact" class="hover:text-strava">Request Medal</a>
                <a href="/" class="hover:text-strava">Home</a>
            </div>
        </div>
    </footer>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        document.addEventListener("DOMContentLoaded", () => {
            const tl = gsap.timeline();

            // 1. Navigation Fade In
            tl.to(".nav-item", { opacity: 1, duration: 0.6, ease: "power2.out" });

            // 2. Hero Elements Rise
            tl.to(".hero-elem", { 
                y: 0, 
                opacity: 1, 
                duration: 0.8, 
                stagger: 0.1, 
                ease: "back.out(1.2)" 
            }, "-=0.3");

            // 3. Table Pop In
            gsap.fromTo(".grid-card", 
                { y: 30, opacity: 0 },
                { 
                    y: 0, 
                    opacity: 1, 
                    duration: 0.6, 
                    ease: "power2.out"
                }
            );
        });
    </script>
</body>
</html>
